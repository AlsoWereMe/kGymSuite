# compose.yml
services:
  kmq:
    image: "kgym-mq:${DEPLOYMENT}"
    build:
      context: ./
      dockerfile: docker/kgym-mq.Dockerfile
    restart: unless-stopped
    # 日志轮转: 防止容器 stdout/stderr 无上限膨胀吃满磁盘
    # (教训: kscheduler 曾因 MQ 重连 traceback 刷爆 346GB json 日志)
    # 单文件上限 50MB, 最多保留 3 份, 每容器日志总量封顶 150MB
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - 5672:5672
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - kgym-default
  kscheduler:
    image: "kgym-scheduler:${DEPLOYMENT}"
    build:
      context: ./
      dockerfile: docker/kgym-scheduler.Dockerfile
      target: release
    restart: unless-stopped
    # 日志轮转: 防止 stdout/stderr 无上限膨胀吃满磁盘 (346GB 事故的兜底)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - 8000:8000
    environment:
      - KBDR_SCHEDULER_CONFIG=/root/config.json
    env_file:
      - path: ./kgym-runner.env
        required: true
    volumes:
      - ./kscheduler-db:/root/scheduler-db
      - ./config.json:/root/config.json
      - ./bucket:/mnt/bucket
    depends_on:
      kmq:
        condition: service_healthy
    networks:
      - kgym-default
  kdashboard:
    image: "kgym-dashboard:${DEPLOYMENT}"
    build:
      context: ./
      dockerfile: docker/kgym-dashboard.Dockerfile
    restart: unless-stopped
    # 日志轮转: 防止 stdout/stderr 无上限膨胀吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - 3000:3000
    volumes:
      - ./config.json:/app/public/config.json
      - ./bucket:/mnt/bucket
    networks:
      - kgym-default
  kvmmanager:
    image: "kgym-vmmanager:${DEPLOYMENT}"
    build:
      context: ./
      dockerfile: docker/kgym-vmmanager.Dockerfile
      target: release
    deploy:
      mode: replicated
      replicas: 4
    restart: unless-stopped
    # 日志轮转: 防止 stdout/stderr 无上限膨胀吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - ./bucket:/mnt/bucket
    env_file:
      - path: ./kgym-runner.env
        required: true
    networks:
      - kgym-default
  kbuilder:
    image: "kgym-builder:${DEPLOYMENT}"
    build:
      context: ./
      dockerfile: docker/kgym-builder.Dockerfile
      target: release
    restart: unless-stopped
    # 日志轮转: 防止 stdout/stderr 无上限膨胀吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 2
    env_file:
      - path: ./kgym-runner.env
        required: true
    volumes:
      - /dev:/dev
      - ./kbuilder-repo:/mnt/repo
      - ./bucket:/mnt/bucket
    privileged: true
    networks:
      - kgym-default
  kprebuilder:
    image: "kgym-prebuilder:${DEPLOYMENT}"
    build:
      context: ./
      dockerfile: docker/kgym-prebuilder.Dockerfile
      target: release
    restart: unless-stopped
    # 日志轮转: 防止 stdout/stderr 无上限膨胀吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./bucket:/mnt/bucket
    env_file:
      - path: ./kgym-runner.env
        required: true
    networks:
      - kgym-default
networks:
  kgym-default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1460
